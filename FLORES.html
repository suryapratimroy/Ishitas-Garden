const messages = [
    "Lali Meri Jaan 🥰💕",
    "Chashmish Baddie❤️",
    "MERI RASMALAI😋😋",
    "ISHITA BKL(BOHOT KHOOBSOORAT LADKI)🌹",
    "A Little Gift For My Lali🌸🤍",
    "BAUNA BADMOSH❤️"
];

const photos = [
    "./img/Lali1.jpg",
    "./img/Lali2.jpg",
    "./img/Lali3.jpeg",
    "./img/Lali4.jpg",
    "./img/Lali5 (1).png",
    "./img/Lali6.png",
    "./img/Lali7.png"
];

let clicks = 0;

document.addEventListener("click", function(e){

    clicks++;

    // Flash
    const flash = document.createElement("div");
    flash.className = "flash";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 400);

    // Petals
    for(let i = 0; i < 20; i++){

        const petal = document.createElement("div");
        petal.className = "petal";

        petal.style.left = e.clientX + "px";
        petal.style.top = e.clientY + "px";

        petal.style.setProperty("--x",(Math.random()*700-350)+"px");
        petal.style.setProperty("--r",(Math.random()*360)+"deg");
        petal.style.animationDelay = (Math.random()*0.2)+"s";

        document.body.appendChild(petal);

        setTimeout(()=>{
            petal.remove();
        },4000);
    }

    // 4 Memory Cards
    for(let j = 0; j < 2; j++){

        const card = document.createElement("div");
        card.className = "memory-card";

        const photo = photos[Math.floor(Math.random()*photos.length)];
        const msg = messages[Math.floor(Math.random()*messages.length)];

        card.style.left = (e.clientX + Math.random()*300 - 150) + "px";
        card.style.top  = (e.clientY + Math.random()*180 - 90) + "px";

        const rot = Math.random()*40 - 20;

        card.style.transform =
        `translate(-50%,-50%) rotate(${rot}deg)`;

        card.innerHTML = `
            <img src="${photo}">
            <h2>${msg}</h2>
        `;

        document.body.appendChild(card);

        setTimeout(()=>{
            card.remove();
        },3500);
    }

    // Secret Ending
    if(clicks === 25){

        setTimeout(()=>{
          document.body.insertAdjacentHTML("beforeend", `
<div class="ending">
    <img src="./img/Lali1.jpg">
    <h1>Nearly spend  5 hours to build this, hope you like it..RASMALAI🌸🌸. :)</h1>
    <p>A LIITLE GIFT FROM YOUR LALA🥰,<br>SP🌸</p>
</div>
`);

           

        },1200);
    }

});

window.onload = () => {
    const music = document.getElementById("bgMusic");
    music.volume = 0.2;

    document.addEventListener("click", async () => {
        try {
            await music.play();
            console.log("Music started");
        } catch (err) {
            console.error(err);
        }
    }, { once: true });
};
