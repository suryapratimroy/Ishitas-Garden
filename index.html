<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Garden Gate</title>
<link rel="icon" href="./img/flowers.png" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --void:        #070d09;
    --moss:        #10201a;
    --moss-2:      #16281f;
    --rose-gold:   #d9a578;
    --rose-gold-2: #c98a5e;
    --blush:       #f0c9d6;
    --gold:        #c9a96a;
    --ivory:       #f4ede1;
    --ivory-dim:   #cfc4ad;
    --err:         #e39a9a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--void);
    color: var(--ivory);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
  }

  body{
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- ambient backdrop ---------- */
  .backdrop{
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 12%, rgba(217,165,120,0.14), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(22,40,31,0.9), transparent 70%),
      radial-gradient(120% 120% at 50% 50%, var(--moss-2) 0%, var(--void) 72%);
    z-index: 0;
  }

  .backdrop::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(217,165,120,0.025) 0px, rgba(217,165,120,0.025) 1px, transparent 1px, transparent 90px);
    opacity: .6;
  }

  .vine{
    position: fixed;
    width: 340px; height: 340px;
    opacity: .35;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(201,169,106,0.08));
  }
  .vine.tl{ top: -60px; left: -60px; }
  .vine.br{ bottom: -60px; right: -60px; transform: rotate(180deg); }

  @media (max-width: 640px){
    .vine{ width: 220px; height: 220px; }
  }

  /* falling petals */
  .petal{
    position: fixed;
    top: -5%;
    z-index: 1;
    pointer-events: none;
    border-radius: 0% 60% 0% 60%;
    background: linear-gradient(135deg, var(--rose-gold), var(--blush));
    opacity: .55;
    animation: fall linear infinite, sway ease-in-out infinite;
  }

  @keyframes fall{
    to{ transform: translateY(110vh); }
  }
  @keyframes sway{
    0%,100%{ margin-left: 0; }
    50%{ margin-left: 40px; }
  }

  /* ---------- gate frame ---------- */
  .gate{
    position: relative;
    z-index: 2;
    width: min(480px, 90vw);
    padding: 56px 40px 44px;
    text-align: center;
    border: 1px solid rgba(217,165,120,0.35);
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(16,32,26,0.55), rgba(7,13,9,0.75));
    backdrop-filter: blur(6px);
    box-shadow:
      0 0 0 1px rgba(201,169,106,0.08),
      0 30px 80px -20px rgba(0,0,0,0.8),
      inset 0 0 60px rgba(217,165,120,0.03);
    animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(26px) scale(.98); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .gate::before, .gate::after{
    content:'';
    position:absolute;
    width: 26px; height: 26px;
    border: 1px solid var(--gold);
    opacity: .6;
  }
  .gate::before{ top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .gate::after{ bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .corner-br{
    position:absolute; bottom:-1px; left:-1px;
    width:26px; height:26px;
    border: 1px solid var(--gold);
    border-right:none; border-top:none;
    opacity:.6;
  }
  .corner-tr{
    position:absolute; top:-1px; right:-1px;
    width:26px; height:26px;
    border: 1px solid var(--gold);
    border-left:none; border-bottom:none;
    opacity:.6;
  }

  /* ---------- signature bloom ---------- */
  .bloom-wrap{
    display:flex; justify-content:center;
    margin-bottom: 6px;
  }
  .bloom{
    width: 74px; height: 74px;
    animation: breathe 5s ease-in-out infinite, spin 40s linear infinite;
    filter: drop-shadow(0 0 14px rgba(217,165,120,0.35));
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); opacity: .92; }
    50%{ transform: scale(1.08); opacity: 1; }
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  /* ---------- greeting letters ---------- */
  .greetings{
    display: flex;
    justify-content: center;
    gap: clamp(4px, 1.6vw, 14px);
    margin: 10px 0 0;
  }

  .greetings span{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    line-height: 1;
    color: var(--ivory);
    background: linear-gradient(180deg, var(--ivory) 30%, var(--rose-gold) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(18px);
    animation:
      petal-in .9s cubic-bezier(.16,1,.3,1) forwards,
      glow-pulse 2.6s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(217,165,120,0.15);
  }

  .greetings span:nth-child(1){ animation-delay: .15s, 1.05s; }
  .greetings span:nth-child(2){ animation-delay: .27s, 1.17s; }
  .greetings span:nth-child(3){ animation-delay: .39s, 1.29s; }
  .greetings span:nth-child(4){ animation-delay: .51s, 1.41s; }
  .greetings span:nth-child(5){ animation-delay: .63s, 1.53s; }

  @keyframes petal-in{
    from{ opacity: 0; transform: translateY(18px) rotate(-4deg); }
    to{ opacity: 1; transform: translateY(0) rotate(0); }
  }

  @keyframes glow-pulse{
    0%, 100%{
      text-shadow:
        0 0 12px rgba(217,165,120,0.65),
        0 0 34px rgba(217,165,120,0.4),
        0 0 70px rgba(240,201,214,0.3);
    }
    50%{
      text-shadow: 0 0 4px rgba(217,165,120,0.15);
    }
  }

  /* second row: garden path dots */
  .path-dots{
    display:flex;
    justify-content:center;
    gap: 12px;
    margin: 18px 0 22px;
  }
  .path-dots span{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    opacity: .35;
    display:inline-block;
    animation: dot-pulse 3.2s ease-in-out infinite;
  }
  .path-dots span:nth-child(odd){ animation-delay: .5s; }
  .path-dots span:nth-child(2){ animation-delay: 1s; }
  .path-dots span:nth-child(4){ animation-delay: 1.6s; }
  .path-dots span:nth-child(6){ animation-delay: 2.1s; }
  @keyframes dot-pulse{
    0%,100%{ opacity:.25; transform: scale(1); }
    50%{ opacity: .9; transform: scale(1.6); background: var(--rose-gold); }
  }

  /* ---------- description ---------- */
  .description{
    margin-bottom: 34px;
  }
  .description span{
    font-family: 'Marcellus', serif;
    font-size: 1rem;
    letter-spacing: .04em;
    color: var(--ivory-dim);
    font-style: normal;
    animation: desc-glow 4.2s ease-in-out infinite;
  }
  @keyframes desc-glow{
    0%, 100%{ text-shadow: 0 0 8px rgba(217,165,120,0.2); }
    50%{ text-shadow: 0 0 20px rgba(240,201,214,0.5); }
  }

  /* ---------- form ---------- */
  .button{
    display:flex;
    flex-direction: column;
    align-items: center;
  }

  #password{
    width: 100%;
    max-width: 320px;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(217,165,120,0.4);
    color: var(--ivory);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: .03em;
    padding: 10px 4px;
    text-align: center;
    transition: border-color .35s ease, box-shadow .35s ease;
  }
  #password::placeholder{
    color: rgba(207,196,173,0.55);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
  }
  #password:focus{
    outline: none;
    border-color: var(--rose-gold);
    box-shadow: 0 8px 24px -14px rgba(217,165,120,0.6);
  }
  #password:focus-visible{
    outline: 2px solid var(--rose-gold);
    outline-offset: 4px;
  }

  .button br{ display:none; }

  button{
    margin-top: 30px;
    position: relative;
    overflow: hidden;
    padding: 14px 40px;
    background: linear-gradient(135deg, var(--rose-gold-2), var(--rose-gold));
    color: var(--void);
    border: none;
    border-radius: 999px;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: .82rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 14px 30px -12px rgba(217,165,120,0.55);
    transition: transform .3s ease, box-shadow .3s ease;
    animation: button-halo 3.6s ease-in-out infinite;
  }
  @keyframes button-halo{
    0%, 100%{ filter: drop-shadow(0 0 6px rgba(217,165,120,0.35)); }
    50%{ filter: drop-shadow(0 0 20px rgba(240,201,214,0.6)); }
  }
  button:hover{
    transform: translateY(-2px);
    box-shadow: 0 18px 34px -12px rgba(217,165,120,0.75), 0 0 30px rgba(240,201,214,0.5);
  }
  button:active{
    transform: translateY(0) scale(.98);
  }
  button:focus-visible{
    outline: 2px solid var(--blush);
    outline-offset: 4px;
  }
  button::after{
    content:'';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
  }
  button:hover::after{ left: 130%; }

  #error{
    min-height: 20px;
    margin-top: 18px;
    font-family: 'Marcellus', serif;
    font-size: .85rem;
    color: var(--err);
    letter-spacing: .02em;
  }
  #error.shake{
    animation: shake .45s ease;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }

  /* unlocked transition overlay */
  .unlock-flash{
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(240,201,214,0.9), var(--void) 75%);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity .55s ease;
  }
  .unlock-flash.active{ opacity: 1; }

  .gate.unlocking{
    animation: unlock-out .6s cubic-bezier(.6,0,.9,.4) forwards;
  }
  @keyframes unlock-out{
    to{ opacity: 0; transform: scale(1.04) translateY(-10px); filter: blur(6px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .petal{ display:none; }
  }

  @media (max-width: 480px){
    .gate{ padding: 44px 22px 34px; }
  }
</style>
</head>

<body>

<div class="backdrop"></div>

<svg class="vine tl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 60 C 40 40, 60 40, 70 70 S 100 110, 130 100 S 160 60, 200 70" stroke="#c9a96a" stroke-width="1"/>
  <circle cx="70" cy="70" r="4" fill="#d9a578" opacity=".8"/>
  <circle cx="130" cy="100" r="3" fill="#f0c9d6" opacity=".7"/>
  <path d="M20 10 C10 30, 30 40, 40 20" stroke="#c9a96a" stroke-width="1"/>
</svg>
<svg class="vine br" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 60 C 40 40, 60 40, 70 70 S 100 110, 130 100 S 160 60, 200 70" stroke="#c9a96a" stroke-width="1"/>
  <circle cx="70" cy="70" r="4" fill="#d9a578" opacity=".8"/>
  <circle cx="130" cy="100" r="3" fill="#f0c9d6" opacity=".7"/>
  <path d="M20 10 C10 30, 30 40, 40 20" stroke="#c9a96a" stroke-width="1"/>
</svg>

<div class="unlock-flash" id="flash"></div>

<div class="gate" id="gate">

  <div class="corner-tr"></div>
  <div class="corner-br"></div>

  <div class="bloom-wrap">
    <svg class="bloom" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#d9a578" stroke-width="1.3">
        <ellipse cx="50" cy="30" rx="10" ry="18" transform="rotate(0 50 50)"/>
        <ellipse cx="50" cy="30" rx="10" ry="18" transform="rotate(72 50 50)"/>
        <ellipse cx="50" cy="30" rx="10" ry="18" transform="rotate(144 50 50)"/>
        <ellipse cx="50" cy="30" rx="10" ry="18" transform="rotate(216 50 50)"/>
        <ellipse cx="50" cy="30" rx="10" ry="18" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="6" fill="#f0c9d6" opacity=".85"/>
    </svg>
  </div>

  <div class="greetings">
    <span>H</span>
    <span>E</span>
    <span>L</span>
    <span>L</span>
    <span>O</span>
  </div>

  <div class="path-dots" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="description">
    <span>Only one Lali can enter this garden... 🌸</span>
  </div>

  <div class="button">

    <input
        type="password"
        id="password"
        placeholder="What does SP call you?"
        autocomplete="off"
    >

    <br><br>

    <button onclick="checkPassword()">
        Unlock ❤️
    </button>

    <p id="error"></p>

  </div>

</div>

<script>

// ---- decorative falling petals (purely visual, no logic impact) ----
(function spawnPetals(){
  const count = window.innerWidth < 600 ? 10 : 18;
  for(let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 8 + Math.random() * 10;
    p.style.width = size + 'px';
    p.style.height = size * 0.8 + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (9 + Math.random() * 10) + 's, ' + (3 + Math.random() * 3) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's, ' + (Math.random() * -5) + 's';
    document.body.appendChild(p);
  }
})();

function checkPassword(){

    let pass = document.getElementById("password").value
                    .toLowerCase()
                    .trim();

    if(pass === "lali"){   // <-- Change this to your secret answer

        const gate = document.getElementById("gate");
        const flash = document.getElementById("flash");

        gate.classList.add("unlocking");
        flash.classList.add("active");

        setTimeout(function(){
            window.location.href = "./FLORES.html";
        }, 50);

    }else{

        const err = document.getElementById("error");
        err.innerHTML = "Wrong answer ❤️ Try again.";
        err.classList.remove("shake");
        void err.offsetWidth;
        err.classList.add("shake");

    }

}

document.getElementById("password").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ checkPassword(); }
});

</script>

</body>
</html>
